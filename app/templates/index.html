<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cisco CUBE SIP Flow & QoS Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #020617;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-white tracking-tight">Cisco CUBE SIP Flow &amp; QoS Monitor</h1>
        <p class="text-xs text-slate-400 mt-1">Real-time SIP signaling, ConfID leg correlation, Q.850 cause codes &amp; call flow exports</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <input
          id="searchInput"
          type="text"
          placeholder="Search Calling, Called, Call-ID, ConfID, Status..."
          class="w-72 sm:w-80 px-3 py-2 text-sm bg-slate-900 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500"
        />
        <button
          onclick="resetSearch()"
          class="px-3 py-2 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition"
        >
          Reset
        </button>
        <button
          onclick="loadCalls()"
          class="px-3 py-2 text-xs font-medium rounded-lg bg-sky-600/20 text-sky-300 border border-sky-500/30 hover:bg-sky-600/30 transition"
        >
          Refresh
        </button>
      </div>
    </div>

    <!-- Calls Table -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-950/90 border-b border-slate-800 text-[11px] uppercase tracking-wider text-slate-400">
              <th class="py-3 px-4">ID</th>
              <th class="py-3 px-4">Calling</th>
              <th class="py-3 px-4">Called</th>
              <th class="py-3 px-4">Invite / Connect Time</th>
              <th class="py-3 px-4">Disconnect Time</th>
              <th class="py-3 px-4">Dur</th>
              <th class="py-3 px-4">Status</th>
              <th class="py-3 px-4">QoS (MOS / Jitter / Loss)</th>
              <th class="py-3 px-4 text-right">SIP Flow</th>
            </tr>
          </thead>
          <tbody id="callsBody" class="divide-y divide-slate-800/70 text-sm">
            <tr>
              <td colspan="9" class="py-8 text-center text-slate-500">Loading captured SIP calls...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const expandedCalls = new Set();
    let refreshTimer = null;

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function statusBadge(status) {
      const s = (status || "").toLowerCase();
      if (s === "completed") {
        return `<span class="px-2 py-0.5 text-xs font-medium rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">Completed</span>`;
      }
      if (s === "connected") {
        return `<span class="px-2 py-0.5 text-xs font-medium rounded-full bg-sky-500/15 text-sky-300 border border-sky-500/30">Connected</span>`;
      }
      if (s === "failed" || s === "canceled") {
        return `<span class="px-2 py-0.5 text-xs font-medium rounded-full bg-rose-500/15 text-rose-300 border border-rose-500/30">${escapeHtml(status)}</span>`;
      }
      return `<span class="px-2 py-0.5 text-xs font-medium rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30">${escapeHtml(status || "Setup")}</span>`;
    }

    function formatQos(call) {
      if (call.qos_mos === null && call.qos_jitter_ms === null && call.qos_packet_loss === null) {
        return `<span class="text-slate-500 text-xs">N/A</span>`;
      }
      const mos = call.qos_mos !== null ? call.qos_mos : "—";
      const jit = call.qos_jitter_ms !== null ? `${call.qos_jitter_ms}ms` : "—";
      const loss = call.qos_packet_loss !== null ? `${call.qos_packet_loss}` : "—";
      return `<span class="mono text-xs text-slate-300">${mos} / ${jit} / ${loss}</span>`;
    }

    function filterByConfId(confId) {
      const input = document.getElementById("searchInput");
      if (input && confId) {
        input.value = confId.slice(0, 17);
        loadCalls();
      }
    }

    function resetSearch() {
      const input = document.getElementById("searchInput");
      if (input) {
        input.value = "";
        loadCalls();
      }
    }

    async function loadCalls() {
      const q = document.getElementById("searchInput").value || "";
      try {
        const res = await fetch(`/api/calls?q=${encodeURIComponent(q)}`);
        if (!res.ok) return;
        const calls = await res.json();
        const tbody = document.getElementById("callsBody");

        if (!calls.length) {
          tbody.innerHTML = `<tr><td colspan="9" class="py-8 text-center text-slate-500">No SIP calls found matching filter.</td></tr>`;
          return;
        }

        const existingDetails = {};
        expandedCalls.forEach(id => {
          const el = document.getElementById(`detail-row-${id}`);
          if (el) existingDetails[id] = el.innerHTML;
        });

        tbody.innerHTML = calls.map(call => {
          const isOpen = expandedCalls.has(call.id);
          const detailHtml = existingDetails[call.id] || `<td colspan="9" class="p-4 text-xs text-slate-400 bg-slate-950">Loading SIP ladder...</td>`;
          return `
            <tr class="hover:bg-slate-800/40 transition">
              <td class="py-3 px-4 mono text-xs text-slate-400">#${call.id}</td>
              <td class="py-3 px-4 font-medium text-slate-100">${escapeHtml(call.calling_number || "Unknown")}</td>
              <td class="py-3 px-4 font-medium text-slate-100">${escapeHtml(call.called_number || "Unknown")}</td>
              <td class="py-3 px-4 text-xs text-slate-300">
                <div><span class="text-slate-500">INV:</span> ${escapeHtml(call.invite_time || "—")}</div>
                <div><span class="text-slate-500">CON:</span> ${escapeHtml(call.connect_time || "—")}</div>
              </td>
              <td class="py-3 px-4 text-xs text-slate-300">${escapeHtml(call.disconnect_time || "—")}</td>
              <td class="py-3 px-4 mono text-xs text-slate-300">${call.duration_sec !== null ? call.duration_sec + "s" : "—"}</td>
              <td class="py-3 px-4">${statusBadge(call.status)}</td>
              <td class="py-3 px-4">${formatQos(call)}</td>
              <td class="py-3 px-4 text-right">
                <button
                  onclick="toggleExpand(${call.id})"
                  class="text-xs font-medium text-sky-400 hover:text-sky-300 underline underline-offset-2"
                >
                  ${isOpen ? "Hide SIP Flow" : "Expand SIP Flow"}
                </button>
              </td>
            </tr>
            <tr id="detail-row-${call.id}" class="${isOpen ? "" : "hidden"}">
              ${detailHtml}
            </tr>
          `;
        }).join("");

        for (const id of expandedCalls) {
          if (!existingDetails[id]) {
            await fetchAndRenderDetail(id);
          }
        }
      } catch (err) {
        console.error("Failed to load calls:", err);
      }
    }

    async function toggleExpand(callId) {
      const row = document.getElementById(`detail-row-${callId}`);
      if (!row) return;
      if (expandedCalls.has(callId)) {
        expandedCalls.delete(callId);
        row.classList.add("hidden");
        loadCalls();
      } else {
        expandedCalls.add(callId);
        row.classList.remove("hidden");
        await fetchAndRenderDetail(callId);
        loadCalls();
      }
    }

    async function fetchAndRenderDetail(callId) {
      const row = document.getElementById(`detail-row-${callId}`);
      if (!row) return;
      try {
        const res = await fetch(`/api/calls/${callId}`);
        if (!res.ok) return;
        const detail = await res.json();
        row.innerHTML = `<td colspan="9" class="p-0">${renderLadder(detail)}</td>`;
      } catch (err) {
        row.innerHTML = `<td colspan="9" class="p-4 text-xs text-rose-400">Error loading SIP flow detail.</td>`;
      }
    }

    function renderLadder(detail) {
      const messages = detail.messages || [];
      const nodes = [...new Set(messages.flatMap(m => [m.src, m.dst]))];

      const nodeHeader = nodes.map(n =>
        `<span class="px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-xs mono text-sky-300">${escapeHtml(n)}</span>`
      ).join(`<span class="text-slate-600 self-center">&harr;</span>`);

      const rows = messages.map((m, idx) => {
        const color = m.is_request ? "text-amber-300" : "text-emerald-300";
        return `
          <div class="px-3 py-2 hover:bg-slate-900/90 transition">
            <div onclick="toggleRawPacket('pkt-${detail.id}-${idx}')" class="flex flex-wrap items-center gap-3 cursor-pointer text-xs">
              <span class="mono text-slate-500 w-24">${escapeHtml(m.time)}</span>
              <span class="mono text-slate-500 w-16">+${m.offset_ms}ms</span>
              <span class="mono text-slate-300">${escapeHtml(m.src)} &rarr; ${escapeHtml(m.dst)}</span>
              <span class="${color} font-semibold flex-1 truncate">${escapeHtml(m.label)}</span>
              <span class="text-slate-500 text-[11px]">Click for raw SIP</span>
            </div>
            <pre id="pkt-${detail.id}-${idx}" class="hidden mt-2 p-3 bg-slate-950 border border-slate-800 rounded text-xs text-slate-300 overflow-x-auto mono">${escapeHtml(m.raw)}</pre>
          </div>
        `;
      }).join("");

      const qosBanner = detail.qos_raw
        ? `<div class="mb-3 p-2.5 bg-slate-950 border border-slate-800 rounded text-xs mono text-emerald-300"><strong>CUBE QoS Header:</strong> ${escapeHtml(detail.qos_raw)}</div>`
        : "";

      const confBadge = detail.session_id
        ? `<span
             onclick="filterByConfId('${escapeHtml(detail.session_id)}')"
             title="Click to filter matching CUBE inbound/outbound call legs"
             class="ml-2 inline-block cursor-pointer px-2 py-0.5 text-[11px] mono rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 hover:bg-indigo-500/40"
           >ConfID: ${escapeHtml(detail.session_id)} (Filter Both Legs)</span>`
        : "";

      return `
        <div class="p-4 bg-slate-900/95 border-t border-slate-800">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-3 text-xs text-slate-400">
            <div>
              <strong class="text-slate-200">Call-ID:</strong>
              <span class="mono">${escapeHtml(detail.call_id)}</span>
              ${confBadge}
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <div class="mr-2"><strong class="text-slate-200">Cause:</strong> ${escapeHtml(detail.disconnect_cause || "—")}</div>
              <a href="/api/calls/${detail.id}/export" download class="px-2.5 py-1 text-[11px] font-medium rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 hover:bg-amber-500/30 transition">Download HTML</a>
            </div>
          </div>
          ${qosBanner}
          <div class="bg-slate-950/70 border border-slate-800 rounded-lg overflow-hidden">
            <div class="flex flex-wrap gap-2 bg-slate-900 px-3 py-2">${nodeHeader}</div>
            <div class="divide-y divide-slate-800/60">${rows}</div>
          </div>
        </div>
      `;
    }

    function toggleRawPacket(elId) {
      const el = document.getElementById(elId);
      if (el) el.classList.toggle("hidden");
    }

    document.getElementById("searchInput").addEventListener("input", () => {
      loadCalls();
    });

    loadCalls();
    refreshTimer = setInterval(loadCalls, 4000);
  </script>
</body>
</html>
