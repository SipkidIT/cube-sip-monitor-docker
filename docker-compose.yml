services:
  cube-sip-monitor:
    build: .
    container_name: cube-sip-monitor
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=America/Los_Angeles
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs
